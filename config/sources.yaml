# Crossroads L1 source configuration — the git-tracked source of truth for feeds (FR-DC-16).
# sync_sources() reconciles this file into DynamoDB (Sources table, live mirror — rows are
# deleted when a source is removed here) and Neo4j (Source nodes are flagged is_active=false
# when removed, never deleted, to preserve provenance for Articles that already reference them).
#
# Fields:
#   source_id          - stable identifier; DynamoDB partition key.
#   name                - human-readable display name.
#   url                 - feed/API endpoint; Neo4j Source natural key (UNIQUE constrained).
#   type                - rss | api.
#   category            - osint | vuln_feed | threat_feed | framework.
#   credibility_score   - float in [0, 1]; consumed by L3 credibility recompute.
#   polling_tier        - standard | frequent | daily (poll cadence bucket).
#   (credentials)       - NOT configured here. Collectors resolve them at runtime via
#                         load_credential(source_id, name) -> SSM SecureString
#                         /crossroads/{env}/{source_id}_{name} (e.g. otx_api_key,
#                         ghsa_token), so source_id MUST match the collector's own id.
#   api_version         - upstream API version pinned against, or null for RSS.

- source_id: krebs
  name: Krebs on Security
  url: https://krebsonsecurity.com/feed/
  type: rss
  category: osint
  credibility_score: 0.9
  polling_tier: standard
  api_version: null

